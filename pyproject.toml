[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--tb=short --cov=astronomer --cov-report=xml"
testpaths = [
    "tests",
]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
pretty = true
show_error_codes = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_context = true
color_output = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# mypy per-module options:
[[tool.mypy.overrides]]
module = [
    "airflow",
    "asgiref"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 110

# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "__pycache__",
    "docs/conf.py",
]

target-version = "py310"
fix = true

[tool.ruff.lint]
# Pin the rule set: newer ruff releases widen the default one.
select = [
    "E4", "E7", "E9", "F",  # ruff's defaults before 0.16
    "W",    # pycodestyle warnings
    "I",    # isort
    "C90",  # Complexity
#    "B",    # flake8-bugbear
    "C",    # flake8-comprehensions
#    "ANN",  # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "T10",  # flake8-debugger
    "A",    # flake8-builtins
    "UP",   # pyupgrade
    "ASYNC",  # flake8-async
    "D",    # pydocstyle
    "S",    # flake8-bandit
]

# Remove this in future
extend-ignore = [
    "A002", "C901", "E402", "E501", "ISC001", "ISC003", "UP030",
    # Carried over from the pydocstyle config.
    "D100", "D104", "D105", "D107", "D205", "D400", "D401",
    # Missing timeout in requests calls. TODO: remove it in future
    "S113",
    # Triggers poll external services, so there is no event to wait on.
    "ASYNC110",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"dev/**" = ["D", "S"]
".circleci/**" = ["S"]
"**/example_dags/**" = ["D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["astronomer", "tests"]

[tool.commitizen]
version = "2.0.0"
version_files = [
    "docs/conf.py",
    "astronomer/providers/package.py",
    "setup.cfg",
]
version_scheme = "semver"

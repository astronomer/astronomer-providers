---
version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

# Run jobs only for version-number tagged builds & All Branches
all_branches_and_version_tag: &all_branches_and_version_tag
  filters:
    tags:
      only: /^\d+[.\d]+.*/

# Run jobs only for version-number tagged builds
version_tag_only: &version_tag_only
  filters:
    tags:
      only: /^\d+[.\d]+.*/
    branches:
      ignore: /.*/

# Run jobs only for main branch and release branches
main_and_release_branches: &main_and_release_branches
  filters:
    branches:
      only:
        - main
        - /^release\b.*$/

workflows:
  test:
    jobs:
      - static-checks:
          <<: *all_branches_and_version_tag
      - mypy:
          <<: *all_branches_and_version_tag
      - generate-constraints:
          name: constraints-<< matrix.python_version >>-<< matrix.airflow_version >>
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
              airflow_version: ["2.9.3", "2.10.5", "2.11.2", "3.3.2"]
            # Airflow 2 supports Python 3.12 at most.
            exclude:
              - {python_version: "3.13", airflow_version: "2.9.3"}
              - {python_version: "3.13", airflow_version: "2.10.5"}
              - {python_version: "3.13", airflow_version: "2.11.2"}
              - {python_version: "3.14", airflow_version: "2.9.3"}
              - {python_version: "3.14", airflow_version: "2.10.5"}
              - {python_version: "3.14", airflow_version: "2.11.2"}
          <<: *main_and_release_branches
      - build-docs:
          <<: *all_branches_and_version_tag
      - test:
          name: test-python<< matrix.python_version >>
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12"]
          <<: *all_branches_and_version_tag
          requires:
            - static-checks
      - test:
          name: test-python3.12-airflow3
          python_version: "3.12"
          airflow_version: "3.3.2"
          <<: *all_branches_and_version_tag
          requires:
            - static-checks
      - test:
          name: test-python3.14-airflow3
          python_version: "3.14"
          airflow_version: "3.3.2"
          <<: *all_branches_and_version_tag
          requires:
            - static-checks
      - build-and-verify:
          <<: *all_branches_and_version_tag
          requires:
            - test
            - test-python3.12-airflow3
            - test-python3.14-airflow3
            - build-docs
            - mypy
      - hold:
          name: Needs-Approval
          type: approval
          <<: *version_tag_only
          requires:
            - build-and-verify
      - publish:
          requires:
            - Needs-Approval
          <<: *version_tag_only

commands:
  install-dependencies:
    parameters:
      extras:
        type: string
      airflow_version:
        type: string
        default: "2.11.2"
    steps:
      - run:
          name: Install Dependencies
          command: |
            PYTHON_VERSION=$(python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
            # Without Airflow's constraints pip backtracks for longer than CircleCI's no-output timeout.
            CONSTRAINTS="constraints-<<parameters.airflow_version>>/constraints-${PYTHON_VERSION}.txt"
            curl -sSfL "https://raw.githubusercontent.com/apache/airflow/${CONSTRAINTS}" \
              -o /tmp/constraints.txt
            pip install -U -e ".[<<parameters.extras>>]" "apache-airflow==<<parameters.airflow_version>>" \
              -c /tmp/constraints.txt

executors:
  docker-executor:
    parameters:
      python_version:
        type: string
        default: "3.10"
    docker:
      - image: cimg/python:<<parameters.python_version>>

jobs:
  static-checks:
    description: "Static checks"
    executor: docker-executor
    steps:
      - checkout
      - run:
          command: |
            cp .pre-commit-config.yaml pre-commit-cache-key.txt
            python --version --version >> pre-commit-cache-key.txt
      - restore_cache:
          keys:
            - v1-pc-cache-{{ checksum "pre-commit-cache-key.txt" }}-
      - run:
          name: Run pre-commit
          command: |
            pip install "pre-commit>=3.0.0"
            pre-commit run --all-files --show-diff-on-failure
      - save_cache:
          key: v1-pc-cache-{{ checksum "pre-commit-cache-key.txt" }}-
          paths:
            - ~/.cache/pre-commit
            - ~/.pyenv/versions/

  mypy:
    description: "Mypy"
    executor:
      name: docker-executor
      python_version: "3.12"
    steps:
      - checkout
      - restore_cache:
          keys:
            # yamllint disable-line rule:line-length
            - mypy-{{ .Branch }}-{{ checksum "setup.cfg" }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ .Environment.CACHE_VERSION }}
      - install-dependencies:
          extras: "all,mypy"
      - run:
          name: Run Mypy
          command: |
            mypy --version
            mypy astronomer/
      - save_cache:
          paths:
            - ~/.cache/pip
            - ~/.pyenv/versions/
          # yamllint disable-line rule:line-length
          key: mypy-{{ .Branch }}-{{ checksum "setup.cfg" }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ .Environment.CACHE_VERSION }}

  build-docs:
    description: "Build docs"
    executor:
      name: docker-executor
      python_version: "3.12"
    steps:
      - checkout
      - restore_cache:
          keys:
            # yamllint disable-line rule:line-length
            - docs-{{ .Branch }}-{{ checksum "setup.cfg" }}-{{ checksum ".readthedocs.yaml" }}-{{ .Environment.CACHE_VERSION }}
      - install-dependencies:
          extras: "docs"
      - run:
          name: Run Sphinx
          command: |
            cd docs
            make clean html
      - save_cache:
          paths:
            - ~/.cache/pip
            - ~/.pyenv/versions/
          # yamllint disable-line rule:line-length
          key: docs-{{ .Branch }}-{{ checksum "setup.cfg" }}-{{ checksum ".readthedocs.yaml" }}-{{ .Environment.CACHE_VERSION }}

  test:
    parameters:
      python_version:
        description: "Python Version"
        type: string
      airflow_version:
        description: "Airflow Version"
        type: string
        default: "2.11.2"
    description: Test Python-<<parameters.python_version>> Airflow-<<parameters.airflow_version>>
    executor:
      name: docker-executor
      python_version: "<<parameters.python_version>>"
    parallelism: 4
    steps:
      - checkout
      - restore_cache:
          keys:
            # yamllint disable-line rule:line-length
            - deps-{{ .Branch }}-<<parameters.airflow_version>>-{{ checksum "setup.cfg" }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ .Environment.CACHE_VERSION }}
      - install-dependencies:
          extras: "all,tests"
          airflow_version: "<<parameters.airflow_version>>"
      - run: pip freeze
      - run:
          name: Run tests
          command: |
            set -e
            TEST_FILES=$(circleci tests glob "tests/**/test_*.py" | circleci tests split --split-by=timings)
            pytest --junit-xml=test-report/report.xml  $TEST_FILES
      - codecov/upload:
          files: coverage.xml
      - store_test_results:
          path: test-report
      - save_cache:
          paths:
            - ~/.cache/pip
            - ~/.pyenv/versions/
          # yamllint disable-line rule:line-length
          key: deps-{{ .Branch }}-<<parameters.airflow_version>>-{{ checksum "setup.cfg" }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ .Environment.CACHE_VERSION }}
  generate-constraints:
    parameters:
      python_version:
        description: "Python Version"
        type: string
      airflow_version:
        description: "Airflow Version"
        type: string
    description: Test Python-<<parameters.python_version>>
    executor:
      name: docker-executor
      python_version: "<<parameters.python_version>>"
    steps:
      - checkout
      - install-dependencies:
          extras: "all,tests"
          airflow_version: "<<parameters.airflow_version>>"
      - run:
          name: Generate Constraints
          command: pip freeze
             | sort
             | grep -v "@"
             > constraints-<<parameters.python_version>>-<<parameters.airflow_version>>.txt
      - store_artifacts:
          path: constraints-<<parameters.python_version>>-<<parameters.airflow_version>>.txt

  build-and-verify:
    executor:
      name: docker-executor
      python_version: "3.12"
    steps:
      - checkout
      - run:
          name: verify tag
          command: |-
            python3 .circleci/scripts/verify_tag_and_version.py
      - run:
          name: build artifacts
          command: |
            pip install -U build
            git clean -fxd
            python -m build

      - persist_to_workspace:
          root: .
          paths:
            - dist/*

  publish:
    executor:
      name: docker-executor
      python_version: "3.12"
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Deploy to PyPI
          command: |-
            pip install -U twine
            twine check /tmp/workspace/dist/*
            twine upload /tmp/workspace/dist/*
      - store_artifacts:
          path: /tmp/workspace/dist/
          destination: dist
